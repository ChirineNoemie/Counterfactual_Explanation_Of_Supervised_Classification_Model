<svg viewBox="0 0 2060 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888888"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E67E22"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B23A2E"/>
    </marker>
  </defs>

  <!-- Titles -->
  <text x="20" y="55" font-size="34" font-weight="bold" fill="#333333">Baseline [Bergamin &amp; Aiolli, 2025]</text>
  <text x="1240" y="55" font-size="34" font-weight="bold" fill="#E67E22">LVQ-Based</text>

  <!-- Row 1: Training data -->
  <rect x="20" y="90" width="800" height="100" rx="16" fill="#F2F2F2" stroke="#888888" stroke-width="3"/>
  <text x="420" y="150" font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">Training data D</text>
  <rect x="1240" y="90" width="800" height="100" rx="16" fill="#F2F2F2" stroke="#888888" stroke-width="3"/>
  <text x="1640" y="150" font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">Training data D</text>
  <text x="1030" y="150" font-size="26" font-style="italic" fill="#777777" text-anchor="middle">identical</text>

  <!-- Arrows row1 -> row2 -->
  <line x1="420" y1="195" x2="420" y2="245" stroke="#888888" stroke-width="6" marker-end="url(#arrowGray)"/>
  <line x1="1640" y1="195" x2="1640" y2="245" stroke="#E67E22" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Row 2: Target class -->
  <rect x="20" y="250" width="800" height="100" rx="16" fill="#F2F2F2" stroke="#888888" stroke-width="3"/>
  <text x="420" y="310" font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">Target class selection y&#8242;</text>
  <rect x="1240" y="250" width="800" height="100" rx="16" fill="#F2F2F2" stroke="#888888" stroke-width="3"/>
  <text x="1640" y="310" font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">Target class selection y&#8242;</text>
  <text x="1030" y="310" font-size="26" font-style="italic" fill="#777777" text-anchor="middle">identical</text>

  <!-- Arrows row2 -> row3 -->
  <line x1="420" y1="355" x2="420" y2="405" stroke="#888888" stroke-width="6" marker-end="url(#arrowGray)"/>
  <line x1="1640" y1="355" x2="1640" y2="405" stroke="#E67E22" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Row 3: Prototypes -->
  <rect x="20" y="410" width="800" height="100" rx="16" fill="#FDEDED" stroke="#B23A2E" stroke-width="3"/>
  <text x="420" y="470" font-size="30" font-weight="bold" fill="#B23A2E" text-anchor="middle">Prototypes: k-medoids</text>
  <rect x="1240" y="410" width="800" height="100" rx="16" fill="#FFF3E0" stroke="#E67E22" stroke-width="3"/>
  <text x="1640" y="470" font-size="30" font-weight="bold" fill="#E67E22" text-anchor="middle">Prototypes: LVQ</text>

  <!-- change connector row3 -->
  <line x1="820" y1="460" x2="960" y2="460" stroke="#B23A2E" stroke-width="4" stroke-dasharray="6,4"/>
  <rect x="960" y="435" width="140" height="50" rx="10" fill="white" stroke="#B23A2E" stroke-width="3"/>
  <text x="1030" y="467" font-size="22" font-weight="bold" fill="#B23A2E" text-anchor="middle">change</text>
  <line x1="1100" y1="460" x2="1235" y2="460" stroke="#B23A2E" stroke-width="4" marker-end="url(#arrowRed)"/>

  <!-- Arrows row3 -> row4 -->
  <line x1="420" y1="515" x2="420" y2="565" stroke="#888888" stroke-width="6" marker-end="url(#arrowGray)"/>
  <line x1="1640" y1="515" x2="1640" y2="565" stroke="#E67E22" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Row 4: Brent optimization -->
  <rect x="20" y="570" width="800" height="100" rx="16" fill="#FDEDED" stroke="#B23A2E" stroke-width="3"/>
  <text x="420" y="630" font-size="26" font-weight="bold" fill="#B23A2E" text-anchor="middle">Optimization via Brent on [x&#8320;, prototype]</text>
  <rect x="1240" y="570" width="800" height="100" rx="16" fill="#FFF3E0" stroke="#E67E22" stroke-width="3"/>
  <text x="1640" y="630" font-size="26" font-weight="bold" fill="#E67E22" text-anchor="middle">Optimization via Brent on [x&#8320;, prototype]</text>

  <!-- change connector row4 -->
  <line x1="820" y1="620" x2="960" y2="620" stroke="#B23A2E" stroke-width="4" stroke-dasharray="6,4"/>
  <rect x="960" y="595" width="140" height="50" rx="10" fill="white" stroke="#B23A2E" stroke-width="3"/>
  <text x="1030" y="627" font-size="22" font-weight="bold" fill="#B23A2E" text-anchor="middle">change</text>
  <line x1="1100" y1="620" x2="1235" y2="620" stroke="#B23A2E" stroke-width="4" marker-end="url(#arrowRed)"/>

  <!-- Arrows row4 -> row5 -->
  <line x1="420" y1="675" x2="420" y2="725" stroke="#888888" stroke-width="6" marker-end="url(#arrowGray)"/>
  <line x1="1640" y1="675" x2="1640" y2="725" stroke="#E67E22" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Row 5: Selection -->
  <rect x="20" y="730" width="800" height="100" rx="16" fill="#F2F2F2" stroke="#888888" stroke-width="3"/>
  <text x="420" y="790" font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">Selection of the q best CFs</text>
  <rect x="1240" y="730" width="800" height="100" rx="16" fill="#F2F2F2" stroke="#888888" stroke-width="3"/>
  <text x="1640" y="790" font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">Selection of the q best CFs</text>
  <text x="1030" y="790" font-size="26" font-style="italic" fill="#777777" text-anchor="middle">identical</text>

  <!-- Arrows row5 -> row6 -->
  <line x1="420" y1="835" x2="420" y2="885" stroke="#888888" stroke-width="6" marker-end="url(#arrowGray)"/>
  <line x1="1640" y1="835" x2="1640" y2="885" stroke="#E67E22" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Row 6: Output -->
  <rect x="20" y="890" width="800" height="100" rx="16" fill="#EAF7EC" stroke="#2E7D32" stroke-width="3"/>
  <text x="420" y="950" font-size="30" font-weight="bold" fill="#2E7D32" text-anchor="middle">q counterfactuals</text>
  <rect x="1240" y="890" width="800" height="100" rx="16" fill="#EAF7EC" stroke="#2E7D32" stroke-width="3"/>
  <text x="1640" y="950" font-size="30" font-weight="bold" fill="#2E7D32" text-anchor="middle">q counterfactuals</text>
  <text x="1030" y="950" font-size="26" font-style="italic" fill="#777777" text-anchor="middle">identical</text>
</svg>
